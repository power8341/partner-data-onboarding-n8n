name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm test
      - name: Workflow file is up to date with the tested logic
        run: |
          node scripts/build_workflow.js
          git diff --exit-code workflows/partner_onboarding.json
