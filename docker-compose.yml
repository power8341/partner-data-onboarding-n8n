services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: beloy
      POSTGRES_PASSWORD: beloy
      POSTGRES_DB: partners
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_SECURE_COOKIE=false
      - N8N_RESTRICT_FILE_ACCESS_TO=/data
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/data
      - ./workflows:/workflows
      - ./credentials:/credentials
    depends_on:
      - postgres

volumes:
  pgdata:
  n8n_data:
